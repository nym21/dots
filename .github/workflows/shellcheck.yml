# Check every shell script on push, failing on shellcheck's warnings.
name: shellcheck
on: [push, pull_request]
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the scripts
        run: |
          files="$(grep -rlE '^#!(/usr/bin/env (ba)?sh|/bin/(ba)?sh)' --exclude-dir=.git . | sort)"
          shellcheck -S warning -x $files
