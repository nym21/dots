# The servers, in groups by their Tailscale names, each an M4 and an M6, and
# the tunnels of each role, applied by fleet update and forwarded to Rex by
# trex. One group serves prod: the one whose servers all serve the commit
# prod's branch names, the group holding prod keeping it on a tie. The others
# serve next, and only they build, each server natively; prod's branch pushed
# to the commit they run swaps the groups. Tunnels are Cloudflare tunnel
# names, whose tokens fleet keeps in the git-ignored pc/.tunnels; each server
# also serves the one named after it, which reaches that server alone.
#
# group  servers...
group a  m4-1 m6-1
group b  m4-2 m6-2
# role   tunnels...
role prod  prod mcp
role next  next
