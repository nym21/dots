# The servers and what each runs, applied by fleet update and forwarded to Rex
# by trex. A mode is prod (crates.io), next or another branch of the official
# repository, or local (this Mac's ~/Developer/mono). Tunnels are Cloudflare
# tunnel names, whose tokens fleet keeps in the git-ignored pc/.tunnels; each
# server also serves the one named after it, which reaches that server alone.
#
# server  mode  tunnels...
m4-1      prod
m4-2      prod
m6-1      next  next prod mcp
m6-2      next  next prod mcp
