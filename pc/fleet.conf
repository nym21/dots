# The servers and what each runs, applied by fleet update and forwarded to Rex
# by trex. A mode is release (crates.io), prod, next or another branch of the official
# repository, or local (this Mac's ~/Developer/mono). Tunnels are Cloudflare
# tunnel names, whose tokens fleet keeps in the git-ignored pc/.tunnels; each
# server also serves the one named after it, which reaches that server alone.
# A mode's servers update one at a time, its versions mixing meanwhile.
#
# server  mode  tunnels...
m4-1      prod  prod mcp
m4-2      prod  prod mcp
# m6-1 is a worker (Master 11-19): prod builds and data, no shared tunnel; fleet
# update lends it prod mcp while m4-1 and m4-2 restart in turn, then takes them back.
m6-1      prod
m6-2      next  next
